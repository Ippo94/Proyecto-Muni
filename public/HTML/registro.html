<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Muni Escazú</title>
    <link rel="stylesheet" href="../STYLE/registro.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Crear Cuenta Ciudadana</h2>
            <form id="registroForm">
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Juan Pérez">
                </div>
                
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="juan@ejemplo.com">
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" required placeholder="8888-8888">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="********">
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>
            <p class="switch-text">¿Ya tienes cuenta? <a href="/HTML/inicioSesion.html">Inicia Sesión aquí</a></p>
        </div>
    </div>
    <script type="module" src="../js/registro.js"></script>
</body>
</html>
