<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Muni Escazú</title>
    <link rel="stylesheet" href="../STYLE/inicioSession.css"> 
</head>
<body>
    <div class="container">
        <div class="form-box login-box">
            <h2>Bienvenido de nuevo</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>
            <p class="switch-text">¿No tienes cuenta? <a href="/HTML/registro.html">Regístrate aquí</a></p>
            <div style="margin-top: 10px; text-align: center;">
                <a href="/HTML/inicioSesion.html" style="font-size: 0.8rem; color: #777;">← Volver al inicio</a>
            </div>
        </div>
    </div>
    <script type="module" src="../js/inicioSesion.js"></script>
</body>
</html>
